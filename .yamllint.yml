---
extends: default

rules:
  line-length: disable
  truthy: disable
  indentation:
    spaces: 2
    indent-sequences: whatever
  braces:
    max-spaces-inside: -1
  colons:
    max-spaces-after: -1   # allow alignment-style ": " padding in schemas
  commas:
    max-spaces-after: -1   # allow alignment-style ", " padding in schemas
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable

ignore:
  # Installed frontend dependencies and generated assets are not source.
  - ui/node_modules/
  - ui/dist/
  - work/
  - .claude/
  # Materialized clones of OTHER repos (workspace members, org overlays).
  # Gitignored, zero tracked files, and not this repo's content: linting
  # them reports a foreign project's style as this project's failure.
  - .bridge/
  # Deliberately unparseable. It is the negative control proving that a
  # broken declaration fails the call instead of being skipped in silence,
  # so a linter that could parse it would mean the control had stopped
  # being one.
  - skills/workload/tests/fixtures/invalid/negative-broken-yaml.yaml
