# Context Budget Schema — JSON Schema Draft 2020-12 in YAML
#
# Validates `context-budget.yaml`, the declared ceiling on the always-on
# context a session loads (CORE) and its per-instance overlay
# `context-budget.user.yaml` (scope: user, never tracked upstream).
#
# The measuring surface itself is specified by
# `scripts/tests/test_measure_context.py`; this schema only guards the shape
# of the policy the measurer reads.
#
# Validation:
#   check-jsonschema --schemafile docs/schemas/context-budget.schema.yaml \
#                    context-budget.yaml
#
# IDE support: add this line at the top of context-budget.yaml:
#   # yaml-language-server: $schema=./docs/schemas/context-budget.schema.yaml

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://bks-lab.github.io/open-bridge/schemas/context-budget.yaml"
title: Context Budget
description: |
  Per-item ceilings on the text every session loads before it answers: the
  `@`-imports, the standing orders carrying `scope: always`, and the Phase 1
  reads. `max_bytes` gates because bytes are exact everywhere; token counts
  ride alongside as an estimate and never fail a build.

type: object
additionalProperties: false
required: [schema_version, items]

properties:
  schema_version:
    const: 1

  calibration:
    type: object
    additionalProperties: false
    properties:
      bytes_per_token:
        type: number
        exclusiveMinimum: 0
        description: >-
          Bytes per token for the offline estimate. Language-dependent; near
          2.6 for English prose, nearer 2.0 for German. Estimate only.
      model:
        type: string
        minLength: 1
        description: >-
          Model asked for exact counts under `--method api`. Token counts are
          model-specific, so the model belongs with the number.

  items:
    type: object
    description: One entry per always-on item, keyed by repo-relative path.
    propertyNames:
      pattern: "^[^/].*[^/]$"
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        max_bytes:
          type: integer
          minimum: 1
          description: >-
            The size at which growing this file has to be argued for in a
            diff. Omit it to track an item without gating it.
        enforce:
          enum: [hard, advisory]
          default: hard
          description: >-
            `hard` (the default) fails the build when the item is over its cap.
            `advisory` measures and reports it identically but keeps it out of
            the exit code. Use it only for an item whose size is driven by
            ONGOING WORK rather than by a file somebody edited: a work-log
            slice grows all week and resets on archive, so a red build there
            reports activity, not a defect. Anything a human authors and
            reviews stays `hard`, because a CORE always-on file over its cap IS
            a defect. An advisory item still prints its overrun by name.
        optional:
          type: boolean
          description: >-
            True when the item legitimately does not exist in every clone
            (instance data). Absent-and-optional passes; absent-and-required
            fails, because a declared file that vanished is a finding.
        source:
          enum: [import, standing-order, phase1, listing]
          description: >-
            Only needed for items no discovery can find — the Phase 1 reads.
            Imports, standing orders and listings are discovered from the tree.
            `listing` marks the derived surface: `listing:skills` and
            `listing:agents` are not files but the name-plus-description block
            the harness injects into every session and every sub-agent
            dispatch, one line per entry.
        note:
          type: string
          minLength: 1
        card:
          type: object
          additionalProperties: false
          description: >-
            What the session loads INSTEAD of this file: a table of contents
            plus a way to fetch one block. Declared here rather than beside
            the source, so the shape and the ceiling it has to respect are one
            decision in one place. `scripts/context-index.py` renders it and
            `measure-context.py` measures what it renders. Omit the block and
            the file stays always-on in full, which is the fail-open default.
          properties:
            kind:
              const: index
              description: >-
                The only kind so far. Named rather than implied, so a second
                one does not have to be told apart by guessing at the keys.
            keep:
              type: array
              items: {type: string, minLength: 1}
              description: >-
                Top-level keys emitted VERBATIM, comments included. For the
                settings a session needs in front of it rather than on
                request. ABSENT means detected from the file's shape; an empty
                list means deliberately none. The two are not the same, and
                each field defaults on its own.
            sections:
              type: array
              items: {type: string, minLength: 1}
              description: >-
                Top-level maps whose children become one index line each.
                Absent means detected, as with `keep`. A name here that the
                source does not have is a finding (`context-index.py
                --check`), not a silent omission — which is why CORE ships
                `card: {kind: index}` bare: naming sections there would fail
                on the first instance whose registry legitimately lacks one.
            label:
              oneOf:
                - {type: string, minLength: 1}
                - type: array
                  items: {type: string, minLength: 1}
              description: >-
                The child field supplying an entry's one line. A list is tried
                in order: entry families disagree about the name (`description`
                for a repo, `display_name` for a customer), and an index whose
                lines are empty is just a list of names.
            label_chars:
              type: integer
              minimum: 20
              description: >-
                Where a label is cut, with a visible ellipsis. The full entry
                is one `--get` away; a truncation nobody can see is not.
