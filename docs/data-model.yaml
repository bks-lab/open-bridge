# The data model of a Bridge, as data. One source for two renderings:
#   - the tables in docs/data-model.md
#   - the ring in the concept section of docs/index.html
# Both are generated by `python3 scripts/data-model.py --write` and checked by
# `python3 scripts/data-model.py`, which also holds this file to the tree:
# every config family the tree has (the list scripts/check-reachability.py
# derives) must have exactly one row here, or, when only an instance has it,
# in that instance's work/data-model.yaml.
schema_version: 1

# Where a piece of data physically lives. A row lists every store its parts use.
stores:
  core:
    short: "open-bridge (CORE)"
    what: "Tracked in open-bridge and shipped to every instance on the next merge."
  private:
    short: "your user branch"
    what: "Tracked on the instance's own user/* branch, which only ever goes to a private origin (rules/push-guard.md)."
  pii:
    short: "instance data"
    what: "Personal or instance-specific data. Ignored by the shipped .gitignore for every clone; a private origin re-allows it by writing negation files (scripts/user-data.py arm), then commits it with the rest of your work."
  overlay:
    short: "org overlay"
    what: "Materialized from an organisation's overlay repository and recorded in overlays.lock.yaml (docs/org-overlays.md)."
  outside:
    short: "outside git"
    what: "Never in a repository: a secret store reached by URI (rules/secret-placement.md), or a local cache or clone under .bridge/."
  object:
    short: "an object store"
    what: "Never in a repository: bytes an entry reaches by an object:// reference, through a declaration in infra/object-stores/ (docs/object-store.md). A local directory can be one."

# When a session reads it.
reads:
  start:
    short: "at session start"
    what: "Something of it is in context before the first answer."
  named:
    short: "when named"
    what: "Opened when the work names it, and not before."

# What every session reads before its first answer. The measured ceiling for
# all of it is context-budget.yaml, enforced by scripts/measure-context.py.
always_on:
  - label: "AGENTS.md"
    what: "The operating manual, @-imported through CLAUDE.md (or the tool's own wrapper)."
  - label: "SOUL/IDENTITY"
    what: "identity/agent/SOUL.md and IDENTITY.md, @-imported once onboarding has seeded them."
  - label: "config slice"
    what: "`python3 scripts/bridge-config.py --session`: the six bridge-config.yaml blocks a session needs; the others are read by the skill that owns them."
  - label: "registry card"
    what: "`python3 scripts/context-index.py ecosystem.yaml`: the settings plus one line per entry; an entry itself comes with `--get <name>` (docs/context-index.md)."
  - label: "order index"
    what: "`python3 scripts/standing-orders.py --index`, plus the bodies of the orders marked `load: eager`."
  - label: "log + board"
    what: "`python3 scripts/worklog.py --recent 3` and work/board.md, never the whole log."
  - label: "skill list"
    what: "Name and description of every skill, injected by the harness (measured as listing:skills)."
  - label: "agent list"
    what: "Name and description of every sub-agent, injected by the harness (measured as listing:agents)."

# One row per config family. `island` says which tier each part belongs to;
# `lives` lists the stores its parts use (keys of `stores` above).
families:
  - path: identity/accounts/
    object: "a cloud tenant, subscription or secret-store reference"
    island: "core: template, schema; user: entries"
    lives: [core, pii]
    references: ["persona_ref → identity/personas/", "*_ref → a secret store, by URI"]
    writer: "a person; onboarding may suggest the first"
    read: named

  - path: identity/agent/
    object: "this orchestrator's own name, role and voice"
    island: "core: templates, soul deck; user: SOUL.md, IDENTITY.md"
    lives: [core, private]
    references: []
    writer: "onboarding seeds it; accepted /bridge-learn lessons fold into SOUL.md"
    read: start

  - path: identity/contracts/
    object: "a recurring obligation the user holds: utility, telco, insurance, subscription"
    island: "core: template, schema; user: entries"
    lives: [core, private]
    references: ["delivery_address_ref → identity/personas/"]
    writer: "a person"
    read: named

  - path: identity/mail-footers/
    object: "how a drafted mail is signed: contact block, badges, cards, a dated notice, small print"
    island: "core: template, schema; user: entries; org: a shared team footer via an overlay"
    lives: [core, pii, overlay]
    references: ["persona_ref → identity/personas/", "extends → identity/mail-footers/"]
    writer: "a person (skills/mail-draft reads and renders it)"
    read: named

  - path: identity/mandants/
    object: "a group that receives outgoing messages"
    island: "core: template, schema; user: entries; org: a shared group via scope"
    lives: [core, pii]
    references: ["context_ref → workflow/contexts/", "mail_profile → workflow/mail-profiles/"]
    writer: "/mandants"
    read: named

  - path: identity/personas/
    object: "an identity the user holds: signature, tax data, filing paths"
    island: "core: template, schema; user: entries"
    lives: [core, pii]
    references: ["mandant_refs → identity/mandants/"]
    writer: "a person; onboarding may seed the first"
    read: named

  - path: identity/vehicles/
    object: "a vehicle the user owns or leases, and the persona that bears it"
    island: "core: template, schema; user: entries"
    lives: [core, private]
    references: ["persona → identity/personas/", "refs → identity/contracts/"]
    writer: "a person"
    read: named

  - path: infra/backups/
    object: "what is backed up where, and whether it is fresh"
    island: "core: template, schema; user: topology.yaml, _state.yaml"
    lives: [core, private]
    references: ["remote_ref → infra/remotes/"]
    writer: "topology by a person; _state.yaml only by the backup executor an instance brings"
    read: named

  - path: infra/channels/
    object: "an outbound transport: mail, chat, bot, digest"
    island: "core: template, schema; user: entries"
    lives: [core, private]
    references: ["runtime.remote → infra/remotes/"]
    writer: "/channel"
    read: named

  - path: infra/instances/
    object: "another Bridge this one should know about"
    island: "core: template, schema; user: entries"
    lives: [core, private]
    references: ["location.host → infra/remotes/", "promote_config_ref → bridge-config.yaml upstreams"]
    writer: "a person; the overlay engine keeps subscribes_overlays current"
    read: named

  - path: infra/remotes/
    object: "a machine: ssh, wake, services"
    island: "core: template, schema; user: entries"
    lives: [core, pii]
    references: ["layout_ref → infra/backups/"]
    writer: "/remote"
    read: named

  - path: infra/secret-stores/
    object: "where a secret lives, who reaches it, which kind belongs in it"
    island: "core: template, schema; user: entries"
    lives: [core, private]
    references: ["unlock.password_ref → another store, by URI",
                 "remote_ref → infra/remotes/",
                 "account_ref → identity/accounts/"]
    writer: "/secrets"
    read: named

  - path: infra/a2a-peers/
    object: "another Bridge or A2A agent this one may ask: card URL, auth, token reference"
    island: "core: template, schema; user: entries; org: members' endpoints"
    lives: [core, private, overlay]
    references: ["credential_ref → a secret store, by URI"]
    writer: "/a2a"
    read: named

  - path: infra/object-stores/
    object: "where content that is not configuration lives, who reaches it, which class belongs in it"
    island: "core: template, schema; user: entries"
    lives: [core, private]
    references: ["credentials.*_ref → a secret store, by URI",
                 "reachable_from.machines → infra/remotes/"]
    writer: "a person; /object-store reads it"
    read: named

  - path: infra/transcriptions/
    object: "where recordings become transcripts, and where those land"
    island: "core: template, schema; user: topology.yaml"
    lives: [core, private]
    references: ["worker host → infra/remotes/"]
    writer: "the meeting-transcription skill"
    read: named

  - path: infra/utilities/
    object: "a supply connection at a location: power, gas, water, heat"
    island: "core: template; user: entries"
    lives: [core, private]
    references: ["portal_password_ref → a secret store, by URI"]
    writer: "a person"
    read: named

  - path: workflow/briefings/
    object: "one briefing a person can ask for: its sections, sources, queries and inbox rules"
    island: "core: template, schema; user: entries; org: a shared profile via an overlay"
    lives: [core, private, overlay]
    references: ["account_ref → identity/accounts/", "github-board boards → workflow/projects/"]
    writer: "a person (scripts/briefing.py reads and runs it)"
    read: named

  - path: workflow/calendars/
    object: "a scheduled outbound action: what, to whom, when"
    island: "core: template, schema; user: entries.yaml"
    lives: [core, pii]
    references: ["recipients → identity/mandants/"]
    writer: "/calendar"
    read: named

  - path: workflow/contexts/
    object: "where a piece of work gets documented"
    island: "core: template, schema; user: entries; org: shared contexts via scope"
    lives: [core, pii, overlay]
    references: ["persona_ref → identity/personas/"]
    writer: "a person, or an org overlay"
    read: named

  - path: workflow/mail-profiles/
    object: "an occasion for mail: footer, theme, greeting, snippets, attachments, client, who it applies to"
    island: "core: template, schema; user: entries; org: a shared format via an overlay"
    lives: [core, private, overlay]
    references: ["footer → identity/mail-footers/", "persona_ref → identity/personas/",
                 "extends → workflow/mail-profiles/", "applies_to.mandants → identity/mandants/"]
    writer: "a person (skills/mail-draft selects and applies it)"
    read: named

  - path: workflow/meetings/
    object: "a recurring meeting series: cadence, meeting folders, wiki protocol target"
    island: "core: template, schema; user: entries"
    lives: [core, private]
    references: ["followup_skill → skills/", "outputs.distribution.mandant → identity/mandants/"]
    writer: "a person; /debrief and /briefing read it"
    read: named

  - path: workflow/projects/
    object: "a board's field values and state map, read before any tracker call"
    island: "core: template, schema; user or org: entries"
    lives: [core, pii, overlay]
    references: ["context_ref → workflow/contexts/", "mandant_ref → identity/mandants/"]
    writer: "a person, or an org overlay; board items only through github-projects-manager"
    read: named

  - path: workflow/ai-services/
    object: "which AI provider and model one consumer uses (briefing chat, task review, triage, a worker)"
    island: "core: template, schema; user: entries"
    lives: [core, private]
    references: []
    writer: "a person"
    read: named

  - path: workflow/workloads/
    object: "one declared run on one machine"
    island: "core: template, schema, contract tests; user: entries"
    lives: [core, private]
    references: ["placement.host → infra/remotes/", "persona_ref → identity/personas/",
                 "response.recipients → identity/mandants/", "response.notify_via → infra/channels/"]
    writer: "/workload"
    read: named

  - path: workflow/workspaces/
    object: "a named binding of code repos and config overlays"
    island: "core: template, schema; user: entries"
    lives: [core, private, outside]
    references: ["overlays → overlays.lock.yaml", "repos → a code repository, cloned under .bridge/"]
    writer: "/workspace (scripts/workspace.py)"
    read: named

  - path: rules/
    object: "a guardrail, tiered by folder"
    island: "core: rules/*.md; org: rules/org/; user: rules/user/"
    lives: [core, overlay, private]
    references: []
    writer: "a person; scripts/validate-bridge.py holds each rule's scope to its folder"
    read: start

  - path: protocols/standing-orders/
    object: "an always-on rule, loaded while task management is enabled"
    island: "core: *.md; user: user/"
    lives: [core, private]
    references: []
    writer: "a person"
    read: start

  - path: skills/
    object: "a packaged procedure: SKILL.md plus its references/"
    island: "any tier, set by metadata.scope"
    lives: [core, overlay, private]
    references: []
    writer: "a person or an agent; scripts/validate-skill-scope.py holds the tier"
    read: start

  - path: trackers/
    object: "a provider playbook that normalizes a tracker's output"
    island: "core only; per-instance settings live in bridge-config.yaml"
    lives: [core]
    references: []
    writer: "CORE maintainers"
    read: named

  - path: themes/
    object: "a vocabulary set for user-facing words"
    island: "core: the built-ins; user: a custom theme"
    lives: [core, private]
    references: []
    writer: "a person"
    read: named

  - path: .claude/agents/
    object: "a sub-agent, spawned inside a session for heavy or parallel work"
    island: "any tier, set by scope"
    lives: [core, private]
    references: []
    writer: "a person"
    read: start

  - path: work/
    object: "the work system: tasks, streams, log, board, memory"
    island: "user, the whole folder"
    lives: [private]
    references: []
    writer: "scripts/worklog.py, scripts/gen-board.py, scripts/inbox.py (work/inbox/), and the skills that write a STATUS.md"
    read: start

# Files an instance carries beside the families.
beside:
  - path: bridge-config.yaml
    what: "the instance's settings; a session reads six of its blocks"
    island: user
    lives: [pii]
  - path: ecosystem.yaml
    what: "the repo registry, read as a card with one entry on demand"
    island: user
    lives: [pii]
  - path: "ecosystem.<name>.yaml"
    what: "a registry fragment, for example an organisation's"
    island: "org or user"
    lives: [pii, overlay]
  - path: overlays.lock.yaml
    what: "which overlay files were materialized, at which revision"
    island: user
    lives: [pii]
  - path: context-budget.yaml
    what: "the declared ceiling for what every session reads"
    island: core
    lives: [core]
  - path: context-budget.user.yaml
    what: "an instance's own caps for its own always-on files"
    island: user
    lives: [pii]
  - path: DESIGN.md
    what: "the design tokens every generated visual reads"
    island: core
    lives: [core]
  - path: .bridge/
    what: "the overlay cache, the workspace clones and the object read cache"
    island: user
    lives: [outside]
  - path: imports/
    what: "incoming files before they are filed"
    island: user
    lives: [outside]
  - path: "object://<store>/<key>"
    what: "content that is not configuration: recordings, filed documents, exports"
    island: user
    lives: [object]

# Words for the ring on the landing page.
ring:
  centre: {en: "session", de: "Sitzung"}
  legend_start: {en: "something of it is read at session start", de: "davon wird etwas beim Session-Start gelesen"}
  legend_named: {en: "opened when the work names it", de: "geöffnet, wenn die Arbeit es nennt"}
  walked: {en: "walked to: the references between entries", de: "weitergegangen: Verweise zwischen Einträgen"}
  outside: {en: "outside git: secret and object stores by URI, local caches", de: "außerhalb von Git: Secret- und Object-Stores per URI, lokale Caches"}
  aria: "What a session reads, as rings. At the centre the session. The first ring is what every session reads before its first answer. The second ring holds the config families, grouped identity, infra, workflow, behaviour and work, with a filled dot where something of the family is read at session start. Beyond it, the references the agent walks along, and outside the dashed line what never enters git."
  foot: {en: "Drawn from docs/data-model.yaml, like the tables in", de: "Aus docs/data-model.yaml gezeichnet, wie die Tabellen in"}
