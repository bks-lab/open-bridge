# generated by scripts/data-model.py from docs/data-model.yaml; edit that, then --write
# Which config folder to read when; paths from the repo root, _template.yaml says what an entry holds. Families only this instance has: identity/agent/INSTANCE.md.
families:
- path: identity/accounts/
  read_when: a cloud tenant, subscription or vault reference; read it before ANY cloud operation (az, wrangler, gcloud, gh api, provider REST) instead of reconstructing tenant, subscription or vault from memory; no raw secret in YAML, reference URIs only
  skill: secrets
  guide: [docs/cloud-accounts.md, rules/secret-placement.md]
- path: identity/agent/
  read_when: this orchestrator's own name, role and voice; IDENTITY.md, SOUL.md and INSTANCE.md load with AGENTS.md
  guide: [identity/agent/README.md]
- path: identity/contracts/
  read_when: 'a recurring obligation: utility, telco, insurance, SaaS'
- path: identity/designs/
  read_when: 'a brand: colours, type and shapes a generated visual uses; DESIGN.md is the default and the index to the others; never hand-pick a brand colour, ask `scripts/designs.py resolve` and add a missing token to the design that owns it'
  guide: [DESIGN.md]
- path: identity/mail-footers/
  read_when: 'drafting a mail: how it is signed'
  skill: mail-draft
  guide: [docs/mail-draft.md]
- path: identity/mandants/
  read_when: who RECEIVES an outgoing message (a recipient group, not an identity the user holds); on when mandants.enabled
  skill: mandants
  guide: [docs/mandants.md]
- path: identity/personas/
  read_when: 'an identity the user HOLDS: signature, tax data, filing paths; loaded when a skill or routing order names it via persona_ref'
  guide: [docs/personas.md]
- path: identity/vehicles/
  read_when: 'a vehicle the user owns or leases: plate, VIN, the persona that bears it'
- path: infra/a2a-peers/
  read_when: 'an A2A agent this Bridge may ask: card, auth, token reference'
  skill: a2a
- path: infra/backups/
  read_when: what is backed up where, and whether it is fresh; activated by topology.yaml existing; CORE ships the data model, no executor, and only the backup executor writes _state.yaml
  guide: [infra/backups/README.md]
- path: infra/channels/
  read_when: 'an outbound transport: mail, chat, bot, digest; scheduled sends go to /schedule'
  skill: channel
  guide: [docs/channels.md]
- path: infra/instances/
  read_when: another Bridge this one should know about
  guide: [docs/multi-instance.md]
- path: infra/object-stores/
  read_when: 'where content that is not configuration lives: recordings, documents, exports'
  skill: object-store
  guide: [docs/object-store.md]
- path: infra/remotes/
  read_when: 'a machine: ssh, wake, services, "which PC"; remote means a machine here, never `git remote`, so check this folder before asking "which PC?"; capability `arm` marks the always-on machine'
  skill: remote
  guide: [docs/remotes.md, docs/always-on-machine.md]
- path: infra/secret-stores/
  read_when: where a secret lives, who reaches it, and which kind belongs in it
  skill: secrets
  guide: [docs/secrets.md]
- path: infra/transcriptions/
  read_when: recording to transcript topology
  guide: [docs/transcription-worker.md]
- path: infra/utilities/
  read_when: 'a supply contract at a location: power, gas, water, heat'
- path: workflow/ai-services/
  read_when: which AI model a service or worker uses (default Claude)
  guide: [docs/ai-services.md]
- path: workflow/briefings/
  read_when: what a briefing shows, from which trackers
  skill: briefing
  guide: [docs/briefings.md]
- path: workflow/calendars/
  read_when: 'a scheduled outbound action: what, to whom, when; on when calendar.enabled'
  skill: calendar
  guide: [docs/calendar.md]
- path: workflow/contexts/
  read_when: where a piece of work gets documented
- path: workflow/cost-centers/
  read_when: 'a project''s costs across accounts: the cost card''s Project filter'
  guide: [docs/cloud-costs.md]
- path: workflow/mail-profiles/
  read_when: 'drafting a mail: the occasion'
  skill: mail-draft
  guide: [docs/mail-draft.md]
- path: workflow/meetings/
  read_when: a recurring meeting series
- path: workflow/projects/
  read_when: a board's field values and state map, before ANY tracker call; never hardcode a field value
  skill: github-projects-manager
- path: workflow/workloads/
  read_when: 'one declared run on one machine; deliberately no status: field, state comes from the live service manager'
  skill: workload
  guide: [docs/workloads.md]
- path: workflow/workspaces/
  read_when: a named binding of repos + config overlays
  skill: workspace
  guide: [docs/workspaces.md]
own_lifecycle: [rules/, protocols/standing-orders/, skills/, trackers/, themes/, .claude/agents/, mods/, work/, docs/, kernel/]
