# Bridge-Agent instance template. Copy to agents/<name>/agent.yaml and edit.
#   cp -r agents/_template agents/<name>
#   cd agents && uv run python -m _runtime.server --agent <name>
#
# A Bridge-Agent fronts ONE persona to the outside world over A2A. See
# docs/representative-agent.md for the full anatomy + safety model.
# Scope: instances are USER (your persona/PII) — this template is CORE.

name: "<Display name>"
description: >
  <One or two sentences: what this agent is for and what it can do.>
version: "1.0.0"

provider:
  organization: "<You or your org>"
  url: "<https://your-site>"
documentation_url: "<https://your-site>"
icon_url: "<https://your-site/favicon.ico>"

# Public hostname (a tunnel maps it to this local port). Advertised in the card.
public_url: "https://<agent-host>"
host: "127.0.0.1"
port: 8011
model: "sonnet"   # a faster model (e.g. haiku) lowers latency for pure public Q&A
# Per-turn wall-clock budget. A broad question that Reads the whole grounding and
# reasons a full answer can take ~60-90s with sonnet; a tunnel's SSE keepalive pings
# hold the connection open that long, and on expiry the runtime returns a text
# "try again" (never a blank). Give it headroom — see README § Latency & the answer
# contract for how to make it FAST (keep grounding small / inject it into the prompt).
timeout: 90

# Trust profile — the two faces described in docs/representative-agent.md § "Two
# faces, one self". Default AND fail-closed fallback (unknown/blank/typo'd value):
# "public". An env override AGENT_TRUST takes precedence over this field.
#
#   public  (default, every shipped agent) — the outer face. Talks to anonymous
#     visitors on the internet. cwd = grounding_dir below (read-confined to public
#     content only), --setting-sources project (never your host ~/.claude), the
#     full recon/secret-store/egress denylist, no session resume. This is the
#     hardened shape this file's other comments describe.
#
#   private — the inner face. For a genuinely trusted deployment only (e.g. your
#     own tooling, or a peer bridge you trust, talking to your OWN bridge-agent —
#     never a public visitor). cwd becomes the instance repo root (full CLAUDE.md /
#     @-imports / .claude/skills — the same context an interactive `claude` session
#     has), --setting-sources user,project, a narrower denylist that still blocks
#     real recon/secret-store/egress binaries (curl, ssh, security, sqlite3, …),
#     and --resume session continuity. grounding_dir below is ignored for cwd
#     purposes (still used for allowed_tools substitution). NEVER set this on an
#     agent whose host (below) is reachable from outside the machine — the loader
#     warns at startup if it is, but does not refuse to start.
#
#   peer — the inner face for a Bridge you do NOT fully trust with your repo: a
#     colleague's or partner's Bridge asking yours. Hardened exactly like public
#     (cwd = grounding_dir, which here is a curated share folder), and the JSON-RPC
#     endpoint answers only callers listed under auth: below. Refuses to start
#     without an auth: block. Put it behind a private network (e.g. tailscale serve,
#     tailnet only), never a public tunnel.
trust: "public"

# Peer authentication (required for trust: peer, optional otherwise). The card then
# declares an HTTP bearer scheme; the card itself stays readable without a token.
# Tokens live in the environment (fill them from your secret store in the launch
# wrapper), never in this file; the loader refuses a raw `token:` key, a missing or
# a token under 32 characters. tailscale_login additionally binds a token to the
# identity `tailscale serve` asserts, so a copied token alone is not enough.
# auth:
#   mode: bearer
#   peers:
#     - id: <peer-name>
#       token_env: AGENT_PEER_TOKEN_<PEER>
#       tailscale_login: <login@of-the-peer>

# Owner approval (optional, any trust level; made for trust: peer). Every finished
# answer is held, the task stays WORKING with a waiting message, and nothing of the
# answer streams out until `command` decides. The command gets one JSON object on
# stdin (task_id, context_id, peer, question, answer, timeout_sec) and prints one:
# {"decision": "approve"}, {"decision": "edit", "text": "..."}, {"decision":
# "reject"} or {"decision": "timeout"}. Anything else fails closed. How the owner
# is asked (messenger, push, web page) lives in that command, with the instance.
# Ready-made for a Bridge with an inbox: scripts/inbox-approve.py (the held answer
# becomes an only-you draft in the inbox; docs/inbox.md).
# Optional triage (auto_approve): a small model releases small answers (ping,
# greeting, general knowledge) without asking. Peer requests, answers longer than
# max_answer_chars and any triage failure still ask. notify: true tells the command
# afterwards with "kind": "notice" (output ignored); leave it off unless your
# command recognises notices (scripts/inbox-approve.py does not).
# approval:
#   command: ["python3", "${tools_dir}/approve.py"]
#   timeout_sec: 3600
#   auto_approve:
#     model: "<small model id>"
#     max_answer_chars: 1500
#     notify: false

# Grounding = the PUBLIC content the agent may read. This is ALSO the agent's cwd
# for a `public` agent (see trust: above), which confines Read/Glob/Grep to public
# content — never the bridge's private files. A public agent must never be able to
# read identity/, work/, or memory. Latency lever: the agent Reads this per turn —
# a large file = a slow turn + a big NDJSON line. Keep it small, or inject the
# public content into system-prompt.md to skip the per-turn Read entirely.
grounding_dir: "<~/path/to/public/content>"

# Read-only file access + ONLY your scoped instance tools, by ABSOLUTE path.
# ${tools_dir} is substituted at load to agents/<name>/tools. No generic shell.
allowed_tools: "Read,Glob,Grep"
# To add fixed-recipient intake (capture a request for you + notify you), copy the
# shipped CORE scaffold into your instance and enable it:
#   cp agents/_template/tools/intake_notify.py agents/<name>/tools/
#   allowed_tools: "Read,Glob,Grep,Bash(python3 ${tools_dir}/intake_notify.py:*)"
# It captures durably and stays capture-only until you set AGENT_NOTIFY_TO (the
# fixed recipient) and override its send() with your transport. It never sends to a
# visitor-supplied address. See docs/representative-agent.md §4 for the contract.
#
# Note: `--permission-mode acceptEdits` auto-allows shell the engine classifies as
# read-only, INDEPENDENT of this allowed_tools list. The runtime ships a broad
# read/recon/egress DENYLIST (cat/sed/awk/git/security/sqlite3/curl/…) as a BACKSTOP
# for that gap — it is not the control. The real read-confinement is cwd = grounding_dir
# (below) plus, ideally, an OS sandbox (sandbox-exec profile / dedicated low-priv user).

# Public-endpoint guardrails (an ungated endpoint WILL be hit).
max_concurrency: 2
max_input_chars: 4000
max_turns: 24
max_contexts: 500

cors_origins:
  - "https://<your-site>"
cors_dev_origins:
  - "http://localhost:3000"

# Optional: override the runtime status strings (CORE defaults are English).
# messages:
#   working: "One moment…"
#   busy: "Lots of requests right now — please try again in a few seconds."

skills:
  - id: public_qa
    name: "<Skill name>"
    description: "<What it answers, grounded in public content. Invents nothing.>"
    tags: [qa]
    examples:
      - "<example question>"
  # If you enable the intake scaffold above, advertise it honestly (honest-card rule):
  # - id: intake
  #   name: "<Intake skill name>"
  #   description: "<Captures a request for the owner and notifies them. Sends nothing autonomously.>"
  #   tags: [intake]
  #   examples:
  #     - "<I'd like to book a call>"
