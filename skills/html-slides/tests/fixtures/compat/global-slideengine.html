<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compat: window.slideEngine</title>
<!-- Old pattern: the deck code reaches the engine through window.slideEngine, creating it
     when the engine did not, and buttons with data-target jump through window.slideEngine.goTo(n). -->
<style>
:root { --font-display: system-ui, sans-serif; --font-body: system-ui, sans-serif; --font-mono: monospace;
  --bg: #101010; --surface: #1c1c1c; --surface2: #262626; --surface-elevated: #2e2e2e;
  --border: rgba(255, 255, 255, 0.08); --border-bright: rgba(255, 255, 255, 0.16);
  --text: #eeeeee; --text-dim: #9a9a9a; --accent: #3a7bd5; --accent-dim: rgba(58, 123, 213, 0.1);
  --code-bg: #0a0a0a; --code-text: #eeeeee; --green: #2e9e5b; --green-dim: rgba(46, 158, 91, 0.1);
  --red: #d64545; --red-dim: rgba(214, 69, 69, 0.1); --amber: #d9a028; --amber-dim: rgba(217, 160, 40, 0.1);
  --cyan: #2aa3b8; --cyan-dim: rgba(42, 163, 184, 0.1); }
:root.theme-light { --bg: #fafafa; --surface: #ffffff; --text: #111111; --text-dim: #555555; --accent: #1f5fb8; }
@media (prefers-color-scheme: light) {
  :root:not(.theme-dark):not(.theme-light) { --bg: #fafafa; --surface: #ffffff; --text: #111111; --text-dim: #555555; --accent: #1f5fb8; }
}
<!-- slide-engine:css:start --><!-- slide-engine:css:end -->
</style>
</head>
<body>
<div class="deck">
<section class="slide slide--content"><div class="slide__inner"><div><h2 class="slide__heading">Menu</h2>
<button type="button" class="jump" data-target="3">Go to slide 4</button></div></div></section>
<section class="slide slide--content"><div class="slide__inner"><div><h2 class="slide__heading reveal">Slide 2</h2><p class="reveal">Neutral sample text.</p></div></div></section>
<section class="slide slide--content"><div class="slide__inner"><div><h2 class="slide__heading reveal">Slide 3</h2><p class="reveal">Neutral sample text.</p></div></div></section>
<section class="slide slide--content"><div class="slide__inner"><div><h2 class="slide__heading reveal">Slide 4</h2><p class="reveal">Neutral sample text.</p></div></div></section>
<section class="slide slide--content"><div class="slide__inner"><div><h2 class="slide__heading reveal">Slide 5</h2><p class="reveal">Neutral sample text.</p></div></div></section>
</div>
<!-- slide-engine:js:start --><!-- slide-engine:js:end -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (!window.slideEngine) { window.slideEngine = new SlideEngine(); }
});
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.jump');
  if (btn) { var t = parseInt(btn.getAttribute('data-target'), 10); if (!isNaN(t)) window.slideEngine.goTo(t); }
});
</script>
</body>
</html>
