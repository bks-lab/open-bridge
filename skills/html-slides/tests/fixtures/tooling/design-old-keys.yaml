colors:
  surface: "#FFFFFF"
  on-surface: "#111111"
  eyebrow: "#555555"
  border: "#DDDDDD"
colorsDark:
  surface: "#101010"
  on-surface: "#EEEEEE"
  eyebrow: "#AAAAAA"
  border: "#333333"
typography:
  h2: {fontFamily: Inter, fontSize: 40px, fontWeight: 600, lineHeight: 1.1, letterSpacing: -0.02em}
components:
  slide-layout: {align: top, paddingTop: 8.9vh, paddingX: 5vw}
  slide-display: {fontFamily: display, fontWeight: 600, fontSize: "clamp(40px, 5.4vw, 190px)", lineHeight: 0.96}
  slide-subtitle: {fontFamily: display, textTransform: none, textColor: "{colors.on-surface}"}
  slide-heading: {typography: "{typography.h2}", fontSize: "clamp(22px, 2.97vw, 82px)", textColor: "{colors.on-surface}"}
  slide-subhead: {fontWeight: 500}
  slide-label: {fontWeight: 500, textTransform: uppercase, textColor: "{colors.eyebrow}"}
  slide-body: {fontFamily: body, fontWeight: 300, fontSize: "clamp(13px, 1.49vw, 42px)", lineHeight: 1.4}
  slide-item-title: {fontWeight: 500}
  slide-result-value: {fontWeight: 500}
  slide-stat: {fontWeight: 600}
  slide-table-head: {fontWeight: 600}
  slide-quote: {fontWeight: 300}
  slide-number: {marker: plain, fontWeight: 600}
  slide-arc: {width: 2px, span: 100%, baseline: "{colors.border}"}
  slide-bleed: {veil: 65, dim: 0.35}
