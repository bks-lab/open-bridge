<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage probe deck</title>
<style>
html,body{margin:0;height:100%;background:#fff;color:#111;font:16px sans-serif}
.deck{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
/* Every slide carries a transform and a left border on purpose: that is the
   resting state of a revealing slide, and the setup in which a fixed child
   resolves against the slide instead of the window (scar N2). */
.slide{height:100vh;box-sizing:border-box;padding:16px 24px;scroll-snap-align:start;
  display:flex;flex-direction:column;border-left:5px solid #888;transform:translateZ(0)}
.slide .stage{flex:1 1 auto;min-height:0;height:auto}
.lead{margin:0 0 8px}
/*STAGE_CSS*/
</style>
</head>
<body>
<div class="deck">
  <section class="slide" id="s0"><h1>Opening</h1></section>
  <section class="slide" id="s1">
    <p class="lead">A frame that is not a stage, playing a foreign source.</p>
    <iframe id="foreign" title="Foreign frame" style="width:40px;height:40px;border:0" srcdoc="<!doctype html><meta charset=utf-8><script>
addEventListener('message', function (e) {
  if (e.source === parent && e.data && e.data.relay) parent.postMessage(e.data.relay, '*');
});
</script>"></iframe>
  </section>
  <section class="slide" id="s2">
    <p class="lead">Stage A: a scaled stage with a logical viewport.</p>
    <div class="stage" id="stageA" data-src="child.html" data-viewport="1600x1000" data-title="Stage A">
      <div class="stage__placeholder">loading</div>
    </div>
    <p><button type="button" data-stage="maximize">max</button>
       <button type="button" data-stage="restart">restart</button></p>
  </section>
  <section class="slide" id="s3"><p>Between</p></section>
  <section class="slide" id="s4"><p>Between, two away from A</p></section>
  <section class="slide" id="s5">
    <p class="lead">Stage B: a reading stage, never scaled.</p>
    <div class="stage" id="stageB" data-src="child.html" data-mode="read" data-title="Stage B">
      <div class="stage__placeholder">loading</div>
    </div>
  </section>
  <section class="slide" id="s6">
    <p class="lead">Stage C: the simulation travels inside the deck.</p>
    <div class="stage" id="stageC" data-srcdoc-ref="sim-c" data-title="Stage C">
      <div class="stage__placeholder">loading</div>
    </div>
  </section>
</div>
<script type="text/plain" id="sim-c" data-encoding="base64">/*SRCDOC_C*/</script>
<script>
/* A minimal stand-in for the slide engine: the stage module only relies on
   .slide elements and, when present, window.SlideDeck. Navigation listens on
   document in the bubble phase, as the real engine does. */
(function () {
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var cur = 0, handlers = {};
  function vis() { return slides.filter(function (s) { return s.getClientRects().length > 0; }); }
  function emit(ev, d) { (handlers[ev] || []).forEach(function (fn) { fn(d); }); }
  function goTo(i) {
    var v = vis();
    cur = Math.max(0, Math.min(i, v.length - 1));
    v[cur].scrollIntoView({ behavior: 'instant', block: 'start' });
    emit('slidechange', { index: cur });
  }
  document.addEventListener('keydown', function (e) {
    if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].indexOf(e.key) > -1) { e.preventDefault(); goTo(cur + 1); }
    else if (['ArrowUp', 'ArrowLeft', 'PageUp'].indexOf(e.key) > -1) { e.preventDefault(); goTo(cur - 1); }
  });
  window.SlideDeck = {
    goTo: goTo, next: function () { goTo(cur + 1); }, prev: function () { goTo(cur - 1); },
    current: function () { return cur; }, count: function () { return vis().length; },
    setTrack: function () {}, on: function (ev, fn) { (handlers[ev] = handlers[ev] || []).push(fn); }
  };
})();
</script>
<script>
/*STAGE_JS*/
</script>
</body>
</html>
