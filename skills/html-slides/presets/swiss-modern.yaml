name: Swiss Modern
slug: swiss-modern
default: true
mood: [systematic, clean, professional, precise]
use_for: "Business strategy, architecture reviews, process documentation, status reports"
personality: "Precise and confident, no decoration without purpose, every element earns its place"

fonts:
  display:
    family: "Inter Tight"
    weights: [400, 600, 700, 800]
    fallback: "system-ui, sans-serif"
  body:
    family: "Inter Tight"
    weights: [400, 600, 700]
    fallback: "system-ui, sans-serif"
  mono:
    family: "JetBrains Mono"
    weights: [400, 600]
    fallback: "'SF Mono', Consolas, monospace"

colors:
  dark:
    bg: "#0f1117"
    surface: "#1a1d27"
    surface2: "#242836"
    surface-elevated: "#2a2f3d"
    border: "rgba(0, 102, 255, 0.06)"
    border-bright: "rgba(0, 102, 255, 0.12)"
    text: "#e8eaf0"
    text-dim: "#6b7280"
    accent: "#0066ff"
    accent-dim: "rgba(0, 102, 255, 0.08)"
    code-bg: "#0a0c12"
    code-text: "#e8eaf0"
    green: "#10b981"
    green-dim: "rgba(16, 185, 129, 0.1)"
    red: "#ef4444"
    red-dim: "rgba(239, 68, 68, 0.1)"
    amber: "#f59e0b"
    amber-dim: "rgba(245, 158, 11, 0.1)"
    cyan: "#06b6d4"
    cyan-dim: "rgba(6, 182, 212, 0.1)"
  light:
    bg: "#ffffff"
    surface: "#f5f5f5"
    surface2: "#eaeaea"
    surface-elevated: "#fafafa"
    border: "rgba(0, 82, 204, 0.08)"
    border-bright: "rgba(0, 82, 204, 0.16)"
    text: "#1a1a1a"
    text-dim: "#6b7280"
    accent: "#0052cc"
    accent-dim: "rgba(0, 82, 204, 0.08)"
    code-bg: "#1a1d27"
    code-text: "#e8eaf0"
    green: "#059669"
    green-dim: "rgba(5, 150, 105, 0.08)"
    red: "#dc2626"
    red-dim: "rgba(220, 38, 38, 0.08)"
    amber: "#d97706"
    amber-dim: "rgba(217, 119, 6, 0.08)"
    cyan: "#0891b2"
    cyan-dim: "rgba(8, 145, 178, 0.08)"

css_overrides: |
  .slide__display { letter-spacing: -2px; font-weight: 800; }
