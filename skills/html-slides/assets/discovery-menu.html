<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Discovery: html-slides</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0f1117; color: #e8eaf0; padding: 40px;
  }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #6b7280; margin-bottom: 32px; }
  .count { color: #0066ff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card {
    border: 2px solid rgba(255,255,255,0.08); border-radius: 16px;
    overflow: hidden; cursor: pointer; transition: all 0.2s ease;
    background: rgba(255,255,255,0.03); position: relative;
  }
  .card:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
  .card.selected { border-color: #0066ff; box-shadow: 0 0 20px rgba(0,102,255,0.15); }
  .card.selected::after {
    content: '\2713'; position: absolute; top: 12px; right: 12px;
    background: #0066ff; color: #fff; width: 24px; height: 24px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .preview {
    height: 180px; padding: 24px; display: flex; flex-direction: column;
    justify-content: center; position: relative; overflow: hidden;
  }
  .preview-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.5px; margin-bottom: 8px;
  }
  .preview-heading { font-size: 24px; font-weight: 700; line-height: 1.1; margin-bottom: 6px; }
  .preview-body { font-size: 13px; opacity: 0.7; line-height: 1.4; }
  .meta {
    padding: 16px 20px; background: rgba(0,0,0,0.3);
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .meta-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .meta-personality { font-size: 11px; color: #6b7280; font-style: italic; margin-bottom: 8px; }
  .meta-fonts { font-size: 11px; opacity: 0.4; font-family: monospace; margin-bottom: 8px; }
  .swatches { display: flex; gap: 6px; }
  .swatch {
    width: 16px; height: 16px; border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .default-badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 1px;
    background: rgba(0,102,255,0.15); color: #0066ff;
  }
</style>
</head>
<body>
<h1>Style Discovery</h1>
<p class="subtitle"><span class="count">{{TOTAL_PRESETS}}</span> presets, click to select</p>
<div class="grid">
<!-- PRESET_CARDS -->
</div>
<script>
document.querySelectorAll('.card').forEach(function(card) {
  card.addEventListener('click', function() {
    document.querySelectorAll('.card').forEach(function(c) { c.classList.remove('selected'); });
    card.classList.add('selected');
    document.title = 'Selected: ' + card.dataset.slug;
  });
});
</script>
</body>
</html>
