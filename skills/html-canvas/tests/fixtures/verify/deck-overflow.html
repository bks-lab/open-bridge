<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck fixture</title>
<style>
:root{--ink:#1a1a1a;--surface:#fafafa}
html,body{margin:0;background:var(--surface);color:var(--ink);font-family:system-ui, sans-serif}
.slide{height:100vh;overflow:hidden;box-sizing:border-box;padding:40px;display:flex;flex-direction:column;justify-content:center}
.tall{height:2400px;flex-shrink:0}
@media print{
  @page{size:297mm 167mm;margin:0}
  .slide{height:167mm;break-after:page}
  .slide:last-of-type{break-after:auto}
}

</style>
</head>
<body>
<section class="slide"><h1>One</h1><p>First slide.</p></section>
<section class="slide"><h1>Two</h1><div class="tall">Too much content for one slide.</div></section>
<section class="slide"><h1>Three</h1><p>Third slide.</p></section>
</body>
</html>
