<!DOCTYPE html>
<!--
  html-canvas SHELL: copy this file, then drop section blocks (references/sections.md)
  into <main>. It already ships the three first-class controls every Bridge HTML
  deliverable gets: LIGHT/DARK (button + key T), DE/EN (button + key L), and PRINT.
  Single-file, offline, zero external dependencies, native UTF-8.

  Tokens come from DESIGN.md. Generate a filled copy instead of copying this file:
    python3 skills/html-canvas/scripts/design-to-css.py --shell --out page.html
  The script owns the region between the design-tokens markers. NEVER hand-pick colors.
  Optional animation layer: paste assets/animations.css after the base styles and
  gate every motion behind prefers-reduced-motion (already done in that file).
-->
<!-- Set lang to the deliverable's DEFAULT language (de|en). The default here is
     lang="en"; for a German-default deliverable change it to lang="de" AND flip the
     language-swap CSS defaults below. The pre-paint, the lang controller, and the
     "|| 'en'" last-resort fallback all follow this attribute. -->
<html lang="en" class="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>

<!-- PRE-PAINT (before the stylesheet): no flash of wrong theme/language.
     Theme uses the .dark class on <html> (DESIGN.md convention, matches design-to-css.py).
     Default is light; honor a saved choice, else the OS preference. -->
<script>
(function(){
  try {
    var t = localStorage.getItem('html-canvas-theme');
    if (t === 'dark' || (t == null && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
    var l = localStorage.getItem('html-canvas-lang');
    document.documentElement.setAttribute('data-lang',
      (l === 'de' || l === 'en') ? l : (document.documentElement.getAttribute('lang') || 'en'));
    document.documentElement.setAttribute('lang', document.documentElement.getAttribute('data-lang'));
  } catch (e) { document.documentElement.setAttribute('data-lang', 'en'); }
})();
</script>

<style>
/* ─── Brand tokens. This region belongs to design-to-css.py; never paste values into it. ───
   The committed shell is brand neutral: the fallbacks below are CSS system colours, so
   an ungenerated copy is plain but legible. Fill the region from the instance's DESIGN.md:
     python3 skills/html-canvas/scripts/design-to-css.py --shell --out page.html
   (new-simulation.py does the same on its own). */
/* design-tokens:begin */
:root{
  --primary:CanvasText; --primary-hover:CanvasText; --secondary:LinkText; --accent:LinkText;
  --accent-subtle:Canvas; --accent-line:GrayText;
  --surface:Canvas; --raised:Canvas; --surface-subtle:Canvas; --surface-muted:Canvas;
  --ink:CanvasText; --on-surface:CanvasText; --on-primary:Canvas;
  --muted:color-mix(in srgb,CanvasText 72%,Canvas); --ink-faint:color-mix(in srgb,CanvasText 62%,Canvas);
  --line:GrayText; --line-subtle:GrayText; --line-strong:CanvasText;
  --ok:CanvasText; --warn:CanvasText; --danger:CanvasText; --info:LinkText;
  --font-sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px; --space-xl:32px; --space-2xl:48px; --space-3xl:64px;
  --radius-sm:4px; --radius-md:6px; --radius-lg:10px; --radius-xl:14px; --radius-full:9999px;
}
/* design-tokens:end */

/* ─── Derived roles. Every value is a reference to a token above, never a colour. ─── */
:root{
  color-scheme:light;
  --heading:var(--primary);                 /* DESIGN.md: headings in primary on light */
  --accent-text:var(--secondary);           /* links and eyebrows: the working colour */
  --accent-soft:var(--accent-subtle);
  --ok-text:var(--ok);
  --code-bg:var(--surface-muted);
  --shadow-soft:none;                       /* no resting shadow: depth is surface + line */
  --shadow-hover:0 8px 20px -6px color-mix(in srgb,var(--primary) 10%,transparent);
}
html.dark{
  color-scheme:dark;
  --heading:var(--ink);                     /* primary is frozen across modes, never text on dark */
}

/* ─── OPTIONAL: semantic lens / actor triads, the one sanctioned "colour = meaning"
   exception. Uncomment when a diagram needs it, and ALWAYS ship a legend (sections.md).
   Mixed from the tokens, so both modes follow the design system without a second block.
:root{
  --core-bg:var(--surface-muted);--core-line:var(--line-strong);--core-ink:var(--on-surface);
  --doc-bg:color-mix(in srgb,var(--ok) 10%,var(--raised));--doc-line:var(--ok);--doc-ink:color-mix(in srgb,var(--ok) 55%,var(--ink));
  --sch-bg:color-mix(in srgb,var(--warn) 12%,var(--raised));--sch-line:var(--warn);--sch-ink:color-mix(in srgb,var(--warn) 45%,var(--ink));
  --human-bg:var(--raised);--human-line:var(--line-strong);--human-ink:var(--muted);
  --ai-bg:var(--accent-subtle);--ai-line:var(--accent);--ai-ink:color-mix(in srgb,var(--secondary) 70%,var(--ink));
  --tech-bg:color-mix(in srgb,var(--secondary) 8%,var(--raised));--tech-line:var(--secondary);--tech-ink:color-mix(in srgb,var(--secondary) 60%,var(--ink));
}
*/

/* ─── Reset + base ─── */
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{
  margin:0; font-family:var(--font-sans); font-size:var(--fs-body-md,16px); line-height:var(--lh-body-md,1.6);
  color:var(--on-surface); background:var(--surface);
  -webkit-font-smoothing:antialiased;
  /* theme swap fades the ground only: no colour animation on text (DESIGN.md, Motion) */
  transition:background-color .2s ease-out;
}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.wrap.narrow{max-width:760px}

/* The family switch is the hierarchy: display face for h1/h2, sans from h3 down.
   Weights and sizes come from DESIGN.md typography; the display face never runs
   under 28px and never in a light weight. */
h1,h2,.display{font-family:var(--font-display);font-weight:var(--fw-h1,500);color:var(--heading);
  text-wrap:balance;hyphens:auto;overflow-wrap:break-word}
h1{font-size:clamp(28px,5vw,var(--fs-h1,44px));line-height:var(--lh-h1,1.15);letter-spacing:var(--ls-h1,-.01em)}
h2{font-size:clamp(28px,4vw,var(--fs-h2,32px));line-height:var(--lh-h2,1.2);font-weight:var(--fw-h2,500)}
h3,h4{font-family:var(--font-sans);color:var(--ink)}
h3{font-size:var(--fs-h3,20px);font-weight:var(--fw-h3,600);line-height:var(--lh-h3,1.35)}
h4{font-size:var(--fs-h4,17px);font-weight:var(--fw-h4,600);line-height:var(--lh-h4,1.4)}
p{max-width:70ch}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
code,kbd{font-family:var(--font-mono);font-size:.92em;font-variant-ligatures:none}
code{background:var(--surface-muted);padding:1px 6px;border-radius:var(--radius-sm)}
kbd{border:1px solid var(--line);border-radius:var(--radius-sm);padding:1px 6px;background:var(--raised)}
:focus-visible{outline:2px solid var(--secondary);outline-offset:2px;border-radius:var(--radius-sm)}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ─── DE/EN swap: pure CSS, no JS touches text nodes ─── */
/* Only the INACTIVE language is hidden. The active one keeps whatever display its
   element has (li stays list-item, td table-cell, span inline, a flex card stays flex),
   so there is no per-tag override list. The hiding rules are (0,4,0): they beat
   any rule of lower specificity that sets display on a pair. An id rule, or a
   rule of four classes or attributes placed after them, still wins, so keep
   display off such selectors.
   An element carrying BOTH attributes (data-de="Start" data-en="Start", or the
   empty form) is the same in both languages and is never hidden.
   English is the default (matches lang="en" above); flip both rules if you default
   to German. Without a data-lang attribute (JS off) the default language shows. */
:root:not([data-lang="de"]) [data-de]:not([data-en]){display:none}
:root[data-lang="de"] [data-en]:not([data-de]){display:none}

/* ─── Topbar (theme · lang · print) ─── */
.topbar{max-width:1100px;margin:18px auto 0;padding:0 24px;display:flex;justify-content:flex-end;gap:8px}
.topbar button{
  font-family:var(--font-sans);font-size:12.5px;color:var(--ink);
  border:1px solid var(--line);background:var(--raised);border-radius:var(--radius-md);
  padding:6px 11px;cursor:pointer;
}
.topbar button:hover{background:var(--accent-subtle)}
/* 44 px targets where a finger is the pointer; a mouse keeps the compact bar */
@media (pointer:coarse){
  .topbar button{min-height:44px;min-width:44px}
}

/* ─── Footer ─── */
footer.canvas-foot{max-width:1100px;margin:48px auto 32px;padding:16px 24px 0;border-top:1px solid var(--line-subtle);font-size:12px;color:var(--muted)}
footer.canvas-foot code{background:none;padding:0}

/* ─── Print ─── */
@media print{
  /* the light palette on a white ground comes from the token region (design-to-css.py) */
  html.dark{color-scheme:light}
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .topbar,nav{display:none !important}
  .reveal{opacity:1 !important;transform:none !important}
}
</style>
</head>

<body>

<div class="topbar">
  <button id="langToggle" data-aria-de="EN: zu Englisch wechseln (L)" data-aria-en="DE: switch to German (L)">DE</button>
  <button id="printBtn" data-aria-de="Als PDF drucken" data-aria-en="Print as PDF" onclick="window.print()">⤓ PDF</button>
  <button id="themeToggle"><span class="tt-glyph" aria-hidden="true">◐</span> <span data-de>Dunkel</span><span data-en>Dark</span></button>
</div>

<main class="wrap">
  <!-- ▼ Drop section blocks from references/sections.md here.
       Every translatable run ships as two siblings:
         <h1><span data-de>Titel</span><span data-en>Title</span></h1>
         <p data-de>Deutscher Absatz …</p><p data-en>English paragraph …</p>  -->
  <h1><span data-de>{{TITLE_DE}}</span><span data-en>{{TITLE_EN}}</span></h1>
</main>

<footer class="canvas-foot">
  <span data-de>Generiert {{DATE}} · Quelle: <code>{{SOURCE_PATH}}</code> · </span>
  <span data-en>Generated {{DATE}} · Source: <code>{{SOURCE_PATH}}</code> · </span>
  <kbd>T</kbd> Theme · <kbd>L</kbd> <span data-de>Sprache</span><span data-en>Language</span> ·
  <span data-de>Single-File, offline, keine externen Dependencies</span><span data-en>single-file, offline, no external dependencies</span>
</footer>

<!-- ─── Controllers: theme (.dark class) + lang (data-lang). Structural twins. ─── -->
<script>
/* Labels for assistive tech are attributes, so the CSS swap cannot reach them.
   Any element with data-aria-de / data-aria-en gets aria-label and title in the
   active language. The lang controller calls this on every switch; call it
   yourself after adding such an element at runtime. `scope` itself counts too,
   so hcApplyAria(button) relabels that button. */
window.hcApplyAria=function(scope){
  var l=document.documentElement.getAttribute('data-lang')==='de'?'de':'en';
  var sel='[data-aria-de],[data-aria-en]', root=scope||document, els=[].slice.call(root.querySelectorAll(sel));
  if(scope&&scope.matches&&scope.matches(sel)) els.unshift(scope);
  els.forEach(function(el){
    var v=el.getAttribute('data-aria-'+l)||el.getAttribute('data-aria-'+(l==='de'?'en':'de'));
    if(v){el.setAttribute('aria-label',v);el.setAttribute('title',v);}
  });
};
(function(){
  var root=document.documentElement, KEY='html-canvas-theme', btn=document.getElementById('themeToggle');
  function dark(){return root.classList.contains('dark');}
  /* the button label is the existing DE/EN span pair plus a glyph, set with textContent only */
  function render(){ if(!btn) return;
    var d=dark(), de=btn.querySelector('[data-de]'), en=btn.querySelector('[data-en]'), g=btn.querySelector('.tt-glyph');
    if(g) g.textContent=d?'☀':'◐';
    if(de) de.textContent=d?'Hell':'Dunkel';
    if(en) en.textContent=d?'Light':'Dark';
    /* the accessible name starts with the visible word (WCAG 2.5.3, label in name) */
    btn.setAttribute('data-aria-de',d?'Hell: zum hellen Design wechseln (T)':'Dunkel: zum dunklen Design wechseln (T)');
    btn.setAttribute('data-aria-en',d?'Light: switch to light theme (T)':'Dark: switch to dark theme (T)');
    window.hcApplyAria(btn); }
  function apply(d){ root.classList.toggle('dark',d); try{localStorage.setItem(KEY,d?'dark':'light');}catch(e){} render(); }
  render();
  if(btn) btn.addEventListener('click',function(){apply(!dark());});
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key!=='t'&&e.key!=='T') return;
    var t=e.target||{}; if(t.isContentEditable||/^(input|textarea|select)$/i.test(t.tagName||'')) return;
    apply(!dark());
  });
  /* following the OS is not a choice: it is never written to storage (theme contract) */
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(e){
    try{ if(localStorage.getItem(KEY)) return; }catch(_){} root.classList.toggle('dark',e.matches); render(); }); }catch(e){}
  window.addEventListener('storage',function(e){ if(e.key===KEY){ root.classList.toggle('dark',e.newValue==='dark'); render(); } });
})();
(function(){
  var root=document.documentElement, KEY='html-canvas-lang', btn=document.getElementById('langToggle');
  function cur(){return root.getAttribute('data-lang')==='de'?'de':'en';}
  function render(){ if(btn){btn.textContent=cur()==='en'?'DE':'EN';} window.hcApplyAria(); }
  function apply(l){ root.setAttribute('data-lang',l); root.setAttribute('lang',l); try{localStorage.setItem(KEY,l);}catch(e){} render(); }
  render();
  if(btn) btn.addEventListener('click',function(){apply(cur()==='en'?'de':'en');});
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key!=='l'&&e.key!=='L') return;
    var t=e.target||{}; if(t.isContentEditable||/^(input|textarea|select)$/i.test(t.tagName||'')) return;
    apply(cur()==='en'?'de':'en');
  });
  window.addEventListener('storage',function(e){ if(e.key===KEY&&(e.newValue==='de'||e.newValue==='en')){ root.setAttribute('data-lang',e.newValue); root.setAttribute('lang',e.newValue); render(); } });
})();
</script>
</body>
</html>
