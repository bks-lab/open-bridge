# Inbox item schema: JSON Schema Draft 2020-12 in YAML
#
# Validates `work/inbox/<id>/item.yaml`, the file `scripts/inbox.py add` writes
# once and never changes. Events under `work/inbox/<id>/events/` are validated
# by `python3 scripts/inbox.py validate` (their verb must be one of the nine
# below). The contract is scripts/inbox.py; this schema mirrors it.
#
# Related:
#   - work/templates/inbox-item.yaml  (annotated example)
#   - docs/inbox.md
#   - work/templates/_schema.status.yaml  (sibling schema, task frontmatter)

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:open-bridge:schema:inbox-item"
title: InboxItem
description: |
  One thing that needs a person, waiting until it is done. Its state (open,
  approved, waiting, deferred, done, dropped) is derived from its events and
  never stored here.

type: object
required: [schema_version, created, from, kind, summary, urgency, gate]
additionalProperties: true        # v1 permissive, like the STATUS schema

properties:
  schema_version:
    const: 1
  created:
    type: string
    description: "ISO timestamp to the minute, set by `add`"
  from:
    type: string
    minLength: 1
    description: "Who filed it: a machine/job, an agent or a tab"
  kind:
    enum: [decision, question, finding, draft, result, idea]
  summary:
    type: string
    minLength: 1
    description: "One line, readable on a phone"
  urgency:
    enum: [now, today, later]
  gate:
    enum: [free, your-yes, only-you]
    description: |
      free: the Bridge may act alone. your-yes: acts after a person's yes,
      plain or conditional. only-you: send, publish, pay; never executed by
      the script.
  task:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: "Slug of the task or stream it belongs to"
  due:
    type: string
    description: "YYYY-MM-DD or YYYY-MM-DDTHH:MM"
  detail:
    type: string
  key:
    type: string
    description: "Dedup key: a repeat with the same key while the item is open adds a `seen` event, not an item"
  action:
    type: object
    additionalProperties: false
    required: [argv]
    properties:
      argv:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
        description: "Executed without a shell"
      label:
        type: string
  closes_when:
    $ref: "#/$defs/probe"
  closer:
    type: string
    enum: [probe, reporter, person, bot]
    description: "Who ends the item when it has no probe: the reporter (closes by key once the condition is gone), a person, or a watcher bot. An item with neither closes_when nor closer has no way out; `add` warns."

$defs:
  probe:
    type: object
    minProperties: 1
    description: |
      A probe against the live source. A probe that cannot be evaluated is
      unknown, never true: the item stays open.
    properties:
      path_exists: {type: string}
      command:
        type: array
        minItems: 1
        items: {type: string}
      expect_exit: {type: integer, default: 0}
      after:
        type: string
        description: "Date or timestamp; true once it has passed"
      unseen_for:
        type: object
        required: [hours]
        properties:
          hours: {type: number, exclusiveMinimum: 0}
        description: "True once no run has refiled the item's key for this many hours (reads the item's `seen` events); for reporters that refile while a condition holds"
      gh_pr:
        type: string
        pattern: "^[^/#]+/[^/#]+#[0-9]+$"
      gh_issue:
        type: string
        pattern: "^[^/#]+/[^/#]+#[0-9]+$"
      state:
        type: string
        description: "gh_pr: merged | closed | open | green. gh_issue: closed | open"
      task_status:
        type: string
      status:
        enum: [backlog, doing, review, done]
        description: "task_status: the status to wait for (default done)"
      all:
        type: array
        items: {$ref: "#/$defs/probe"}
      any:
        type: array
        items: {$ref: "#/$defs/probe"}
