# Inbox item schema: JSON Schema Draft 2020-12 in YAML
#
# Validates `work/inbox/<id>/item.yaml`, the file `scripts/inbox.py add` writes
# once and never changes. Events under `work/inbox/<id>/events/` are validated
# by `python3 scripts/inbox.py validate` (their verb must be one of
# inbox.VERBS; a `describe` event carries a `brief` as `$defs/brief`, the
# same shape as the `brief:` block of a STATUS.md). The contract is
# scripts/inbox.py; this schema mirrors it.
#
# Related:
#   - work/templates/inbox-item.yaml  (annotated example)
#   - docs/inbox.md
#   - work/templates/_schema.status.yaml  (sibling schema, task frontmatter)

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:open-bridge:schema:inbox-item"
title: InboxItem
description: |
  One thing that needs a person, waiting until it is done. Its state (open,
  approved, waiting, deferred, done, dropped) is derived from its events and
  never stored here.

type: object
required: [schema_version, created, from, kind, summary, urgency, gate]
additionalProperties: true        # v1 permissive, like the STATUS schema

properties:
  schema_version:
    const: 1
  created:
    type: string
    description: "ISO timestamp to the minute, set by `add`"
  from:
    type: string
    minLength: 1
    description: "Who filed it: a machine/job, an agent or a tab"
  kind:
    enum: [decision, question, finding, draft, result, idea]
    description: "What it is. Its art is derived, never stored: decision, question, draft are an ask; finding, result a report; idea an idea (docs/inbox.md § Arts)"
  summary:
    type: string
    minLength: 1
    description: "One line, readable on a phone"
  urgency:
    enum: [now, today, later]
  gate:
    enum: [free, your-yes, only-you]
    description: |
      free: the Bridge may act alone. your-yes: acts after a person's yes,
      plain or conditional. only-you: send, publish, pay; never executed by
      the script.
  task:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: "Slug of the task or stream it belongs to"
  area:
    type: string
    description: "The area (a workplace.workspaces name) of an item without a task; a later `area` event replaces it. With a task, the task's area counts"
  due:
    type: string
    description: "YYYY-MM-DD or YYYY-MM-DDTHH:MM"
  detail:
    type: string
  key:
    type: string
    description: "Dedup key: a repeat with the same key while the item is open adds a `seen` event, not an item"
  action:
    type: object
    additionalProperties: false
    required: [argv]
    properties:
      argv:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
        description: "Executed without a shell"
      label:
        type: string
  closes_when:
    $ref: "#/$defs/probe"
  closer:
    type: string
    enum: [probe, reporter, person, bot]
    description: "Who ends the item when it has no probe: the reporter (closes by key once the condition is gone), a person, or a watcher bot. `add` files an item with neither closes_when, closer nor action as `person`, so none is left without a way out."

$defs:
  brief:
    type: object
    additionalProperties: false
    required: [goal]
    description: |
      What was written about an item: a goal, an optional user story and the
      acceptance criteria, plus who wrote it, when and against which text.
      One shape in two places, the `brief:` block of a STATUS.md and the
      `describe` event of an inbox item. The gate every writer passes is
      scripts/lib/bridge_cockpit/card_fields.py validate_brief; its
      BRIEF_LIMITS are the limits below. No text holds a dash as punctuation.
    properties:
      goal:
        type: string
        minLength: 1
        maxLength: 140
        description: "One sentence: what is true once the item is done"
      story:
        type: object
        additionalProperties: false
        required: [as, want, so_that]
        description: "Optional user story: as <who>, I want <what>, so that <why>"
        properties:
          as: {type: string, minLength: 1, maxLength: 80}
          want: {type: string, minLength: 1, maxLength: 80}
          so_that: {type: string, minLength: 1, maxLength: 80}
      acceptance:
        type: array
        minItems: 0
        maxItems: 5
        items: {type: string, minLength: 1, maxLength: 120}
        description: "Testable outcomes, not steps. A stream has none"
      by:
        type: string
        pattern: "^(?=.*[0-9])[A-Za-z0-9][A-Za-z0-9._:/@-]*$"
        description: "The model id exactly as the run's modelUsage reports it, never an alias such as haiku"
      at:
        type: string
        format: date
        description: "The day it was written"
      basis:
        type: string
        pattern: "^[0-9a-f]{16}$"
        description: "sha256 prefix of the STATUS.md text without this block (card_fields.brief_basis): a brief whose basis differs from the file's is stale"
      edited:
        type: boolean
        description: "true once a person changed it; a model then never rewrites it unasked"

  probe:
    type: object
    minProperties: 1
    description: |
      A probe against the live source. A probe that cannot be evaluated is
      unknown, never true: the item stays open.
    properties:
      path_exists: {type: string}
      command:
        type: array
        minItems: 1
        items: {type: string}
      expect_exit: {type: integer, default: 0}
      after:
        type: string
        description: "Date or timestamp; true once it has passed"
      unseen_for:
        type: object
        required: [hours]
        properties:
          hours: {type: number, exclusiveMinimum: 0}
        description: "True once no run has refiled the item's key for this many hours (reads the item's `seen` events); for reporters that refile while a condition holds"
      gh_pr:
        type: string
        pattern: "^[^/#]+/[^/#]+#[0-9]+$"
      gh_issue:
        type: string
        pattern: "^[^/#]+/[^/#]+#[0-9]+$"
      state:
        type: string
        description: "gh_pr: merged | closed | open | green. gh_issue: closed | open"
      task_status:
        type: string
      status:
        enum: [backlog, doing, review, done]
        description: "task_status: the status to wait for (default done)"
      all:
        type: array
        items: {$ref: "#/$defs/probe"}
      any:
        type: array
        items: {$ref: "#/$defs/probe"}
