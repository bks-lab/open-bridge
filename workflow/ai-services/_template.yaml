# yaml-language-server: $schema=./_schema.yaml
# One consumer's AI selection. Copy to <id>.yaml; absent files keep Claude.
# Built-in consumers: briefing-chat, task-review, triage, cockpit-organize (organize with AI),
# cockpit-describe (each item's brief, scripts/lib/bridge_cockpit/describe.py; default haiku),
# cockpit-activity (the summary of a point's activity on Work through, activity.py; default haiku),
# cockpit-instruct (the instruction line of Work through, instruct.py; default haiku).
# Workers opt in with scripts/ai-run.py --service <id>.
schema_version: 1
scope: user
id: example-worker
provider: claude              # claude | codex; no automatic fallback
# Optional model for each provider. Omitted: caller's Claude model / Codex CLI default.
models: {}
# models:
#   claude: sonnet
#   codex: your-model-id
