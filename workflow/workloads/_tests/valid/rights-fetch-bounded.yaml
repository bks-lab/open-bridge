# Coverage case: a fetch right that names its hosts. The list is what stops an
# unbounded reach the moment the next move is chosen by a model rather than
# typed by an author.
schema_version: 1
scope: core
id: rights-fetch-bounded
title: Rights fetch bounded
purpose: "Example run that fetches from two named hosts and reaches nobody"
placement: {host: example-host, kind: interval, runtime: launchd, owner: bridge}
schedule: {every_sec: 21600, timezone: Europe/Berlin}
execution:
  command: ["/usr/local/bin/example-scout", "--once"]
  working_dir: /var/lib/example
  timeout_sec: 900
response: {evidence: log-trace, notify_on: [failure, missing], notify_via: example-notify}
rights:
  standing:
    tools: "Read,Glob,Grep,WebFetch"
    read_scope: example/notes
    fetch_scope: [example.com, charts.example.org]
    reaches_humans: false
