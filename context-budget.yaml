# yaml-language-server: $schema=./docs/schemas/context-budget.schema.yaml
---
# Context budget — the declared ceiling on what every session loads before it
# answers anything.
#
# WHAT THIS FILE IS FOR. A session opens by loading the `@`-imports named in
# the entry file (AGENTS.md), every standing order carrying `scope: always`, and the Phase 1
# reads. That body of text is paid on every turn, and roughly half of it never
# shows up in a client's context listing because it arrives through tool reads
# rather than imports. Nothing measured it, so it only grew. One file here has
# never sprawled, `identity/agent/SOUL.md`, and the only thing that
# distinguishes it is a declared cap that a validator enforces.
#
#   python3 scripts/measure-context.py            # report + gate (bytes, offline)
#   python3 scripts/measure-context.py --method api   # exact token counts
#
# WHAT A CAP MEANS. `max_bytes` is not a target and not a prediction. It is the
# size at which the next person to grow this file has to say why, in a diff a
# reviewer sees. Caps below sit a little above what each file measures today,
# so ordinary edits pass and a step change does not.
#
# WHAT GATES. Bytes. They are exact, offline, and identical on every machine.
# Tokens are reported next to them as an estimate and never fail a build:
# a single bytes-per-token factor across mixed content is too crude to gate on.
# Run with `--method api` for exact, model-specific counts.
#
# PER-INSTANCE ENTRIES belong in `context-budget.user.yaml`, which is not
# tracked here. It replaces an entry wholesale by key.

schema_version: 1

calibration:
  # Calibrated against reported context sizes: English prose in this repo runs
  # near 2.6 bytes per token, German nearer 2.0. Bytes-over-four is not a
  # usable estimator — it was measured 57 % low on German content. A fork whose
  # always-on files are not English should override this.
  bytes_per_token: 2.6
  # Token counts are model-specific; this is the model `--method api` asks.
  model: claude-opus-5

items:
  # ---------------------------------------------------------------- imports --
  CLAUDE.md:
    optional: true
    source: import
    max_bytes: 4000
    note: >-
      Legacy entry. CORE ships none. While a fork still has one, Claude Code
      loads ONLY this file, so it must import AGENTS.md (else measure-context
      reports shadowed). scripts/migrate-entry-file.py moves its lines and
      removes it. Remove this item once forks have migrated.
  CLAUDE.local.md:
    optional: true
    source: import
    max_bytes: 4000
    note: >-
      Legacy entry, same rule as CLAUDE.md: when present, Claude Code loads it
      instead of AGENTS.md. scripts/migrate-entry-file.py moves its lines.
  .claude/CLAUDE.md:
    optional: true
    source: import
    max_bytes: 4000
    note: >-
      Legacy entry, same rule as CLAUDE.md. scripts/migrate-entry-file.py
      moves its lines.

  AGENTS.md:
    max_bytes: 32768
    note: >-
      The entry file and the operating manual, and still the largest single always-on item. It
      routes; it does not restate. Every load-bearing pointer in it is a
      markdown link, which `scripts/check-doc-routes.py` holds to resolving.
      RAISED from 32000 on 2026-08-30, and the argument belongs in the diff a
      reviewer sees, which is what this cap is for. The 1,378 bytes bought the
      config-family index: one row per family, each naming the path and what
      brings a session to it. `scripts/check-reachability.py` found five
      families that existed in the tree and were named in nothing a session
      loads, so the list is now load-bearing rather than decorative, and CI
      fails when it falls behind the tree.
      RAISED from 33000 on 2026-09-11 by 100 bytes, which is what the
      `identity/vehicles/` row costs. The family shipped its `_template.yaml`
      and `_schema.yaml` while `AGENTS.md` named no route to it, so
      `check-reachability.py` failed: the index is the only always-on place a
      family can be named. 32 bytes of headroom before, 32 after, on purpose.
      The next family row needs its own argument in its own diff, which is
      what the tightness is for.
      RAISED from 33100 on 2026-09-20 by 100 bytes, the cost of the
      `infra/secret-stores/` row. The family carries the placement policy the
      `secrets` skill reads: which kind of secret belongs in which store. It
      has to be named here because `check-reachability.py` accepts no other
      always-on place, and because the question it answers, "where does this
      token go", is one a session asks before it has read anything else.
      16 bytes of headroom before, 16 after, again on purpose.
      RAISED from 33200 on 2026-09-22 by 100 bytes for the
      `infra/object-stores/` row (#226), which costs 107: 20 bytes of headroom
      before, 13 after. The family carries the placement
      policy the `object-store` skill reads: which class of content belongs in
      which store. Its question, "where does this recording go, if not into
      git", is asked at the moment a file is written, and a session that does
      not know the family exists writes the file into the work tree, where the
      only thing between it and a commit is an ignore entry somebody remembered.
      RAISED from 33300 on 2026-09-24 by 200 bytes for the one line that
      points at `docs/where-things-live.md` (#164), at the end of Required
      Reading, which costs 173: 13 bytes of headroom before, 40 after. The map answers the question asked most
      often, "which file answers this", before anything else has been read,
      and the answer usually sits in a skill reference nobody thought to open.
      A pointer that lives anywhere but here is found only by somebody who
      already knows where to look, which is the case the map exists for.
      RAISED from 33500 on 2026-09-27 by 100 bytes for the `infra/a2a-peers/`
      row, which costs 87 (shortened from 111 to fit): 16 bytes of headroom
      after. The family names the agents this Bridge may call and where their
      tokens are, and the `a2a` skill reads it. Its question, "whom can I ask,
      and how do I authenticate", comes up when a user says "ask X's Bridge",
      before any file about A2A has been read.

      RAISED from 33600 on 2026-10-04 by 400 bytes: the `### Inbox` section (what stays
      open is filed with scripts/inbox.py, not left as a log sentence). 49 bytes of headroom.
      RAISED from 34000 on 2026-10-04 by 200 bytes: one sentence naming the workplace
      (scripts/workplace.py, docs/workplace.md) next to `### Inbox` and one clause in
      Remotes that capability `arm` marks the always-on machine. 19 bytes of headroom.
      RAISED from 34200 on 2026-10-06 by 100 bytes for ONE row naming both mail
      families (`workflow/mail-profiles/`, `identity/mail-footers/`, skills/mail-draft).
      Two rows would have cost 228; the shared row keeps both reachable at 110.
      LOWERED from 34300 to 32768 on 2026-10-30 when CLAUDE.md was deleted:
      AGENTS.md became the entry file (Phase 0 line at the top, the import
      block for the instance layer) and was tightened to 32646 bytes. 32768 is
      the cut past which Codex stops reading the file, so this cap is a hard
      ceiling now, not a review prompt. Step 2 lowers it further.

  # Instance import slots. AGENTS.md imports all three; CORE ships none of them.
  identity/agent/IDENTITY.md:
    optional: true
    source: import
    max_bytes: 4096
    note: >-
      USER import slot in AGENTS.md; absent in CORE and on a fresh clone,
      created by onboarding D4. An instance overrides the cap in
      context-budget.user.yaml.
  identity/agent/SOUL.md:
    optional: true
    source: import
    max_bytes: 4096
    note: >-
      USER import slot; mirrors the 80 lines / 4 KB cap bridge-audit enforces.
  identity/agent/INSTANCE.md:
    optional: true
    source: import
    max_bytes: 4000
    note: >-
      The instance's own always-on file (USER, never shipped by CORE or an
      overlay) and the only place a fork adds always-on text, so nobody edits
      AGENTS.md. scripts/migrate-entry-file.py carries a fork's CLAUDE.md lines
      here. An instance raises the cap in context-budget.user.yaml, with a reason.
  ecosystem.yaml:
    optional: true
    source: phase1
    note: >-
      Created at onboarding, so absent in a fresh clone. It used
      to be an `@`-import read in full, and it is the one always-on file that
      grows with the instance rather than with this repo: one line per repo,
      customer, workspace and board, each with a paragraph nobody needs before
      its name comes up. It is now INDEXED — Phase 1 loads the card below and
      fetches an entry when somebody names one. The cap is on the card, which
      is why there is one at all: a table of contents has a size CORE can
      reason about, a registry does not.
    card:
      kind: index
      keep: [org, local_root, work_system]
      # No `sections:` on purpose, and the schema doc next to the field says
      # why: a declared name the source does not have is a finding, and CORE
      # cannot know which sections an instance's registry has. Absent means
      # detected. This shipped as
      # `[base, customers, internal, partners, workspaces]` until 2026-09-11,
      # of which `internal` and `partners` were not in ecosystem.example.yaml
      # either, so the card was wrong against this repo's own example. It went
      # unseen because --check skips a card whose target is absent, and
      # ecosystem.yaml is created at onboarding, so it is absent in every clone here.
      label: [description, display_name, name]

  # ---------------------------------------------------------------- listings --
  # DERIVED, not read. The harness injects `name` + `description` of every
  # skill and every sub-agent into every session, and into every sub-agent
  # dispatch, and until this entry existed none of it was measured anywhere.
  # It is the one always-on cost that grows with how much the Bridge can DO
  # rather than with how much it has been told, and it is invisible in every
  # client's context listing because it never was a file.
  #
  # The cap is on the sum because there is no file to cap. The report names the
  # heaviest entries instead, since a listing grows one description at a time
  # and the sum is the last place that growth shows up.
  #
  # Instances run far larger listings than CORE: one measured 111 skills at
  # 73 400 bytes, more than every `@`-import in that tree combined. An instance
  # raises these in `context-budget.user.yaml` — WITH a reason, the same
  # discipline every other cap here carries.
  "listing:skills":
    source: listing
    max_bytes: 30000
    note: >-
      36 skills, 24 965 bytes at the time of writing, mean 693. The cap leaves
      room for roughly seven more before it bites, which is deliberate: it
      should bite while a description can still be shortened rather than after
      the surface has doubled.
  "listing:agents":
    source: listing
    max_bytes: 4000
    note: >-
      One sub-agent ships in CORE. The entry exists at one instance so the
      SECOND one is measured the day it lands, rather than the day somebody
      wonders where the context went.

  # ---------------------------------------------------------------- harness --
  # Loaded by the harness itself, named in no file of this tree. Discovered by
  # `measure-context.py` the way the harness resolves it, so an instance that
  # never declares it is still measured (and reported `undeclared`).
  "harness:memory-index":
    source: harness
    optional: true
    max_bytes: 25600
    note: >-
      The auto-memory `MEMORY.md` Claude Code loads into every main session,
      from the directory `scripts/memory-location.py` resolves for the harness
      (`autoMemoryDirectory`, else the per-project default). Absent in a fresh
      clone and with auto memory off (setting or env). A lookup that raises
      is the failing state `error`, never absent. Counted nowhere until 2026-10: one
      instance carried 20 227 bytes of it unmeasured. The cap is the harness's
      own load limit (25 KB); past it the tail is silently not loaded, so the
      row counts the loaded part and reports `over`: a defect, not growth.

  # -------------------------------------------------------- standing orders --
  # Only the orders that are actually always-on, i.e. `load: eager`. The five
  # carrying `load: on-trigger` are fetched by their vocabulary and left this
  # list when the contract landed; `measure-context.py` still names them under
  # the table, so a deferred body is never mistaken for one that vanished.
  # The three below stayed eager on purpose: each bites when nobody says its
  # vocabulary, which is the only criterion that keeps an order eager.
  protocols/standing-orders/board-task-criteria.md:
    max_bytes: 7000
    note: >-
      RETURNED to eager. It shipped deferred in d3b8e036 behind the triggers
      "new task", "create a task", "STATUS.md". Those words are only spoken
      once somebody has already decided there is a task, and the order exists
      to answer that question when nobody has. So it loaded in every case
      except the one it was written for. The body is the decision tree behind
      `document-work.md`'s offer, which is eager and cannot ask a question
      whose criteria are absent.
  protocols/standing-orders/inbox.md:
    max_bytes: 1200
    note: >-
      Eager on purpose: the duty (file what stays open, never leave it as a log
      sentence) must bite while nobody says "inbox". Body kept to the rules.
  protocols/standing-orders/document-work.md:
    max_bytes: 3000
  protocols/standing-orders/security-baseline.md:
    max_bytes: 2000

  # ------------------------------------------------------------ Phase 1 reads --
  # Named in `rules/operations.md` § Phase 1. They are instance data, absent in
  # a fresh clone, and CORE ships no cap for them: a board or a log is as long
  # as that instance's work makes it. Declaring them anyway means an instance
  # gets them measured without editing a CORE file — an uncapped item is
  # reported, never a build failure.
  work/board.md:
    optional: true
    source: phase1

  # ------------------------------------------------------------- commands --
  # Not every always-on payload is a file. These two are computed at the moment
  # of use, so they can never be stale, and the meter measures what they print
  # rather than what they read. Both replace something larger: the index stands
  # in for six deferred order bodies, and the slice for fifteen config blocks
  # that belong to the skills owning them.
  "cmd:python3 scripts/standing-orders.py --index":
    source: phase1
    max_bytes: 4000
    note: >-
      The always-on half of the standing-order load contract. Grows by one line
      per order, which is the cost the contract is worth paying.
  "cmd:python3 scripts/bridge-config.py --session":
    source: phase1
    max_bytes: 6000
    note: >-
      Six of twenty-one blocks. Empty in a fresh clone, since a fresh clone has
      no bridge-config.yaml, and that is not an error.
  "cmd:python3 scripts/memory-location.py index":
    source: phase1
    max_bytes: 25600
    note: >-
      The memory index for a harness that reads only AGENTS.md. Empty in a
      fresh clone, and one line inside Claude Code with auto memory on, since
      the harness already loaded the same file (counted under
      `harness:memory-index`). The meter runs every command as Claude Code
      would, so the same index is never counted twice. The cap is the harness's own
      load limit for MEMORY.md (25 KB), which `memory-location.py check`
      enforces on the file itself.
  "cmd:python3 scripts/worklog.py --recent 3":
    source: phase1
    note: >-
      The week header, the rolling TODO and the three most recent day blocks.
      No cap shipped, for the same reason board.md carries none: CORE cannot
      know how long an instance's log rows run. Watch this line anyway. On the
      instance this was built against, the whole log measured 405,076 bytes and
      this slice 115,492, of which a single day was 95,842 across 55 rows.
      NOT what `/archive` fixes, and the earlier wording here said otherwise:
      the slice is always the three most recent blocks, and archiving removes
      what lies BEFORE them. The driver is row length times rows per day.
