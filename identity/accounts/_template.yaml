# Account Definition
# Copy to accounts/{slug}.yaml. One file per account (mail, calendar, or
# combined). Contexts reference accounts by id via `accounts: [id, ...]`.
#
# Accounts describe WHERE mail/calendar data lives and HOW Claude reaches it.
# Credentials never live here — only access method + KeyVault/1Password URIs.

scope: user                        # REQUIRED — core→open-bridge · org→your org overlay · user/private→local.
                                   # Org tenant / customer access = org; personal account = user.
id: my-account                     # stable slug, used as reference from contexts
display_name: "My Account"
owner: my-handle                   # persona id (e.g. <persona>-company) or your handle for self
status: active                     # active | paused | disabled
# docs_ref: "<org>/<infra-repo> docs/<topic>/README.md"   # optional: where the human docs live;
                                   #   this file stays the machine-readable source

# ---------------------------------------------------------------------------
# Mail configuration (optional — omit block if this is calendar-only)
# ---------------------------------------------------------------------------
mail:
  address: "user@example.com"
  provider: microsoft365           # microsoft365 | google | icloud | imap | exchange
  access:
    # How Claude reads/writes this mailbox. Pick ONE primary method.
    primary: graph-api             # graph-api | imap | applescript | skill
    # skill: email-manager         # when primary=skill
    # imap:
    #   host: imap.example.com
    #   port: 993
    #   user: "user@example.com"
    #   credential_ref: "keychain://imap-example-com/user"   # a reference, never a value
  flags:
    attachment_processing: true    # flagged-mail intake workflow
    send: true                     # outbound allowed

# ---------------------------------------------------------------------------
# Calendar configuration (optional — omit block if mail-only)
# ---------------------------------------------------------------------------
calendar:
  provider: microsoft365           # microsoft365 | google | icloud | caldav
  access:
    primary: graph-api             # graph-api | icalbuddy | caldav | mcp
    # icalbuddy_name: "Work"       # calendar name as seen by icalBuddy
    # caldav:
    #   url: https://...
    #   credential_ref: "1password://<vault>/<item>/<field>"   # a reference, never a value
  flags:
    read: true
    write: false                   # Claude may create/move events

# ---------------------------------------------------------------------------
# Code host configuration (optional — GitHub, GitLab, Azure DevOps)
# ---------------------------------------------------------------------------
# code_host:
#   provider: github               # github | gitlab | ado | bitbucket
#   user: my-handle
#   access:
#     primary: cli                 # cli | api | ssh
#     cli: gh                      # command name
#   orgs:
#     - my-org
#     - my-other-org
#   ssh_key_ref: "~/.ssh/id_ed25519"
#   token_ref: "azure-keyvault://<vault>/<secret>"   # NEVER inline the token

# ---------------------------------------------------------------------------
# Cloud costs (optional): scripts/cloud-costs.py, guide docs/cloud-costs.md
# Read once a day on the always-on machine for the cockpit's overview page.
# azure, aws, gcp and twilio use their logged-in CLIs (az, aws, bq, twilio); openai and
# anthropic need an ADMIN key, stored with the secrets skill and named here.
# ---------------------------------------------------------------------------
# costs:
#   enabled: true
#   provider: azure                # optional: azure | aws | gcp | openai | anthropic | twilio | elastic (default: guessed)
#   subscriptions: [<subscription-id>]   # azure, optional: default every id under `subscriptions:`
#   group_by: service              # azure: service | resource_group | tag:<name>; aws: service
#   profile: my-profile            # aws or twilio CLI profile (default: the CLI's active login)
#   key_ref: "keychain://<service>/<account>"   # openai, anthropic, elastic: the admin key, a reference only
#   split: project                 # one entry per part (<id>/<part>): openai project; azure resource_group | tag:<name>;
#                                  #   elastic index_size (with shares, cluster_url, size_key_ref: docs/cloud-costs.md)
#   parts: {rg-a-pre: "A", rg-a-prod: "A"}   # optional with split: names parts; the same name is one entry
#   budgets: {A: 30}               # optional with split: a budget per part or name
#   organization_id: <id>          # elastic: the Elastic Cloud organization (default: the key's first)
#   bigquery_table: my-project.billing.export   # gcp: the Cloud Billing export table
#   budget_month: 50               # optional, in `currency`
#   currency: EUR                  # optional, default EUR
#   login: [az, login]             # optional: the command the cockpit offers when the login is missing
#   host: my-laptop                # optional: only the collector on this infra/remotes machine asks it
#                                  #   (the machine whose CLI login or key store holds it); unset: every collector

# ---------------------------------------------------------------------------
# Cross-references (optional)
# ---------------------------------------------------------------------------
# persona_ref: my-persona          # which persona owns this account
# contexts: [my-context, customer-a]  # which contexts use this account
